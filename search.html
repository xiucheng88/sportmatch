<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级搜索 - SportMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-indigo-600">SportMatch</a>
            <nav class="space-x-6 hidden md:flex font-medium">
                <a href="search.html" class="text-indigo-600 font-bold">搜索</a>
                <a href="matches.html" class="hover:text-indigo-600">查找比赛</a>
                <a href="partners.html" class="hover:text-indigo-600">运动球友</a>
                <a href="vacancies.html" class="hover:text-indigo-600">寻找替补</a>
            </nav>
            <div>
                <a href="get-started.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">立即开始</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto py-12 px-4">
        <h2 class="text-3xl font-bold mb-6">🔍 全球运动多维搜索</h2>
        
        <!-- 筛选面板 -->
        <div class="bg-white p-6 rounded-2xl shadow-md border grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">运动项目</label>
                <select id="sportFilter" class="w-full p-3 border rounded-lg bg-gray-50">
                    <option value="all">全部运动</option>
                    <option value="Badminton">羽毛球 (Badminton)</option>
                    <option value="Football">足球 (Football)</option>
                    <option value="Basketball">篮球 (Basketball)</option>
                    <option value="Pickleball">匹克球 (Pickleball)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">国家 / 城市</label>
                <input id="cityFilter" type="text" placeholder="例如: Malaysia, Bintulu" class="w-full p-3 border rounded-lg bg-gray-50" value="Bintulu">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">水平要求</label>
                <select id="levelFilter" class="w-full p-3 border rounded-lg bg-gray-50">
                    <option value="all">不限水平</option>
                    <option value="beginner">新手友好</option>
                    <option value="intermediate">中等水平</option>
                    <option value="advanced">高手进阶</option>
                </select>
            </div>
            <div class="flex items-end">
                <button onclick="performSearch()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">立即检索</button>
            </div>
        </div>

        <!-- 结果展示区 -->
        <h3 id="resultCount" class="text-xl font-bold mb-4">为您找到以下匹配结果：</h3>
        <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 动态卡片 -->
            <div class="bg-white p-6 rounded-xl shadow border">
                <div class="flex justify-between items-center mb-2">
                    <span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-semibold">招募中</span>
                    <span class="text-sm text-gray-500">📍 Bintulu 室内球馆</span>
                </div>
                <h4 class="text-xl font-bold">周三羽毛球双打友谊赛</h4>
                <p class="text-gray-600 text-sm my-2">项目：羽毛球 | 水平：中等 | 缺额：2人</p>
                <button onclick="alert('报名成功！')" class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-lg font-bold hover:bg-indigo-100 transition">立即报名</button>
            </div>
        </div>
    </main>

    <script>
        function performSearch() {
            const sport = document.getElementById('sportFilter').value;
            const city = document.getElementById('cityFilter').value;
            const container = document.getElementById('resultsContainer');
            
            container.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow border col-span-2">
                    <div class="flex justify-between items-center mb-2">
                        <span class="bg-indigo-100 text-indigo-700 text-xs px-3 py-1 rounded-full font-semibold">精选推荐</span>
                        <span class="text-sm text-gray-500">📍 ${city || '全球'}</span>
                    </div>
                    <h4 class="text-xl font-bold">${sport === 'all' ? '综合运动' : sport} 专属局</h4>
                    <p class="text-gray-600 text-sm my-2">已成功按照您的条件（城市: ${city}）过滤，欢迎随时加入！</p>
                    <button onclick="alert('报名成功！')" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition">一键加入组局</button>
                </div>
            `;
        }
    </script>
</body>
</html>
