<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运动球友 - SportMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-indigo-600">SportMatch</a>
            <nav class="space-x-6 hidden md:flex font-medium">
                <a href="search.html" class="hover:text-indigo-600">搜索</a>
                <a href="matches.html" class="hover:text-indigo-600">查找比赛</a>
                <a href="partners.html" class="text-indigo-600 font-bold">运动球友</a>
                <a href="vacancies.html" class="hover:text-indigo-600">寻找替补</a>
            </nav>
            <div>
                <a href="get-started.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">立即开始</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-12 px-4">
        <h2 class="text-3xl font-bold mb-8">👥 全球与同城运动搭档</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow border text-center">
                <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-4">A</div>
                <h3 class="text-xl font-bold">Alex Chen</h3>
                <p class="text-indigo-600 text-sm font-semibold mt-1">⭐️ 中级羽毛球玩家</p>
                <p class="text-gray-500 text-sm my-3">常驻城市：Malaysia, Bintulu<br>喜好：寻找周末双打搭档</p>
                <button onclick="alert('已成功向 Alex 发送搭档申请！')" class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-lg font-bold hover:bg-indigo-100 transition">加为运动搭档</button>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border text-center">
                <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-4">S</div>
                <h3 class="text-xl font-bold">Steven Kuok</h3>
                <p class="text-green-600 text-sm font-semibold mt-1">⭐️ 进阶匹克球/羽毛球手</p>
                <p class="text-gray-500 text-sm my-3">常驻城市：Malaysia, Sibu / Bintulu<br>喜好：切磋球技，结识新朋友</p>
                <button onclick="alert('已成功向 Steven 发送搭档申请！')" class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-lg font-bold hover:bg-indigo-100 transition">加为运动搭档</button>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border text-center">
                <div class="w-20 h-20 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-4">D</div>
                <h3 class="text-xl font-bold">David Lee</h3>
                <p class="text-purple-600 text-sm font-semibold mt-1">⭐️ 篮球组织者</p>
                <p class="text-gray-500 text-sm my-3">常驻城市：Malaysia, Kuala Lumpur<br>喜好：组织3v3/5v5对抗赛</p>
                <button onclick="alert('已成功向 David 发送搭档申请！')" class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-lg font-bold hover:bg-indigo-100 transition">加为运动搭档</button>
            </div>
        </div>
    </main>
</body>
</html>
