<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMatch - 全球运动匹配平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- 导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-indigo-600">SportMatch</a>
            <nav class="space-x-6 hidden md:flex font-medium">
                <a href="search.html" class="hover:text-indigo-600">搜索</a>
                <a href="matches.html" class="hover:text-indigo-600">查找比赛</a>
                <a href="partners.html" class="hover:text-indigo-600">运动球友</a>
                <a href="vacancies.html" class="hover:text-indigo-600">寻找替补</a>
            </nav>
            <div>
                <a href="get-started.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">立即开始</a>
            </div>
        </div>
    </header>

    <!-- 核心 Banner -->
    <section class="bg-indigo-700 text-white py-20 text-center px-4">
        <div class="max-w-3xl mx-auto">
            <h2 class="text-4xl font-extrabold mb-4">连接全球运动爱好者，随时随地组局开打</h2>
            <p class="text-lg mb-8 text-indigo-100">寻找附近球友、加入比赛或寻找替补，涵盖羽毛球、足球、篮球、网球、匹克球等热门项目！</p>
            
            <a href="search.html" class="inline-block bg-white text-indigo-700 font-bold px-8 py-4 rounded-xl shadow-lg hover:bg-indigo-50 transition">前往搜索比赛与球友 →</a>
        </div>
    </section>

    <!-- 快捷功能入口 -->
    <section class="max-w-7xl mx-auto py-16 px-4">
        <h3 class="text-2xl font-bold text-center mb-10">探索平台功能</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 text-center">
            <a href="matches.html" class="bg-white p-6 rounded-xl shadow hover:shadow-md transition border">
                <span class="text-4xl">🏆</span>
                <h4 class="font-bold text-lg mt-3">查找比赛</h4>
                <p class="text-gray-500 text-sm mt-1">浏览并加入附近正在招募的比赛</p>
            </a>
            <a href="partners.html" class="bg-white p-6 rounded-xl shadow hover:shadow-md transition border">
                <span class="text-4xl">👥</span>
                <h4 class="font-bold text-lg mt-3">运动球友</h4>
                <p class="text-gray-500 text-sm mt-1">结识同城与您水平相当的运动搭档</p>
            </a>
            <a href="vacancies.html" class="bg-white p-6 rounded-xl shadow hover:shadow-md transition border">
                <span class="text-4xl">⚡</span>
                <h4 class="font-bold text-lg mt-3">寻找替补</h4>
                <p class="text-gray-500 text-sm mt-1">球队缺人？快速招募替补球员</p>
            </a>
            <a href="get-started.html" class="bg-white p-6 rounded-xl shadow hover:shadow-md transition border">
                <span class="text-4xl">🚀</span>
                <h4 class="font-bold text-lg mt-3">立即开始</h4>
                <p class="text-gray-500 text-sm mt-1">注册账号，发布您的第一个球局</p>
            </a>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-8 text-center">
        <p>&copy; 2026 SportMatch. 构建全球运动社交连接。</p>
    </footer>

</body>
</html>
