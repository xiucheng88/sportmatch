<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻找替补 - SportMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-indigo-600">SportMatch</a>
            <nav class="space-x-6 hidden md:flex font-medium">
                <a href="search.html" class="hover:text-indigo-600">搜索</a>
                <a href="matches.html" class="hover:text-indigo-600">查找比赛</a>
                <a href="partners.html" class="hover:text-indigo-600">运动球友</a>
                <a href="vacancies.html" class="text-indigo-600 font-bold">寻找替补</a>
            </nav>
            <div>
                <a href="get-started.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">立即开始</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-12 px-4">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold">⚡ 紧急替补与救场广场</h2>
            <button onclick="alert('发布替补需求功能已开启，请前往 matches 页面发布！')" class="bg-red-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-red-700 transition">+ 我要发布缺人求救</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow border border-red-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="bg-red-100 text-red-600 text-xs px-3 py-1 rounded-full font-bold">🚨 急需 1 人救场</span>
                    <span class="text-sm text-gray-500">📍 Bintulu 室内球馆</span>
                </div>
                <h3 class="text-xl font-bold text-gray-900 mb-1">羽毛球双打临时缺人</h3>
                <p class="text-gray-600 text-sm mb-4">时间：今晚 8:00 - 10:00。原队友突发感冒，急需中级水平球友替补，场地费全免！</p>
                <button onclick="alert('火速救场申请已发送！队长将通过电话或系统联系您。')" class="w-full bg-red-600 text-white py-3 rounded-lg font-bold hover:bg-red-700 transition">🔥 火速报名救场</button>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border border-orange-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="bg-orange-100 text-orange-600 text-xs px-3 py-1 rounded-full font-bold">⚠️ 寻找 2 名替补</span>
                    <span class="text-sm text-gray-500">📍 社区足球场</span>
                </div>
                <h3 class="text-xl font-bold text-gray-900 mb-1">5人制足球赛防守队员</h3>
                <p class="text-gray-600 text-sm mb-4">时间：明天下午 5:00。队伍缺后卫，欢迎热爱足球的朋友加入并肩作战！</p>
                <button onclick="alert('火速救场申请已发送！')" class="w-full bg-orange-600 text-white py-3 rounded-lg font-bold hover:bg-orange-700 transition">🔥 火速报名救场</button>
            </div>
        </div>
    </main>
</body>
</html>
